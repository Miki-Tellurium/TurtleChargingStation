plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	runs {
		//
		// This adds a new gradle task that runs the datagen API: "gradlew runDatagenClient"
		//
		datagenClient {
			inherit client
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
			vmArg "-Dfabric-api.datagen.modid=${archives_base_name}"

			runDir "build/datagen"
		}
	}
}

sourceSets {
	main {
		resources {
			srcDirs += [
					'src/main/generated'
			]
		}
	}
}

repositories {
	mavenCentral()
	maven {
		// ModMenu
		name = "terraformersmc maven"
		url = "https://maven.terraformersmc.com"
	}
	maven {
		url = 'https://maven.shedaniel.me'
	}
	maven {
		// CC:Tweaked
		name = "Squiddev maven cct"
		url = 'https://maven.squiddev.cc'
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	flatDir {
		dirs 'libs'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	//modImplementation "maven.modrinth:telluriumforge:${telluriumforge_version}-${minecraft_version}-fabric"
	modImplementation ("blank:telluriumforge:1.4.0-${minecraft_version}-fabric")

	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
	modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"

	modImplementation "cc.tweaked:cc-tweaked-${minecraft_version}-fabric:${cc_version}"
	modCompileOnlyApi("cc.tweaked:cc-tweaked-${minecraft_version}-core:${cc_version}")
	modCompileOnlyApi("cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cc_version}")
	modRuntimeOnly("cc.tweaked:cc-tweaked-${minecraft_version}-common:${cc_version}")
	modCompileOnlyApi("cc.tweaked:cc-tweaked-${minecraft_version}-common-api:${cc_version}")
	modCompileOnlyApi("cc.tweaked:cc-tweaked-${minecraft_version}-fabric-api:${cc_version}")

	include modApi("teamreborn:energy:${team_reborn_energy_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	include implementation("com.electronwill.night-config:toml:${nightconfig_version}")
	include implementation("com.electronwill.night-config:core:${nightconfig_version}")
}

processResources {
	inputs.property "mod_version", mod_version

	filesMatching("fabric.mod.json") {
		expand "mod_version": mod_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	version = "${project.version}-${minecraft_version}-fabric"

	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {

	}
}